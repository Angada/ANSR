<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RayDar — Talent Trend Radar</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  /* ===== RayDar — self-contained radar UI. No app.css. ===================== */
  :root{
    /* light super-CPU / console palette (deep-orange accent) */
    --bg:#F4F3EF; --bg2:#F9FAFB; --panel:#FFFFFF; --panel-solid:#FFFFFF;
    --line:#E7E3DC; --line2:#D9D3C8;
    --grn:#CE4502; --grn-dim:#FF5400; --cyan:#005465; --amber:#C77B2B; --mag:#B5316E; --red:#C0392B;
    /* secondary text was too light to read at small sizes — darkened so labels
       and captions clear WCAG AA on the cream/white panels. */
    --txt:#141414; --dim:#3B3733; --dim2:#554E45;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:var(--sans);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--txt); background:var(--bg);
    min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* radar canvas backdrop: concentric rings + slow sweep */
  .radar-bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(1100px 720px at 84% -12%, rgba(206,69,2,.06), transparent 60%),
      radial-gradient(900px 700px at 6% 110%, rgba(0,84,101,.045), transparent 55%),
      var(--bg);}
  .radar-bg::before{content:""; position:absolute; left:50%; top:38%; width:190vmax; height:190vmax;
    transform:translate(-50%,-50%);
    background:
      repeating-radial-gradient(circle, rgba(0,36,46,.05) 0 1px, transparent 1px 88px);
    -webkit-mask:radial-gradient(circle at center, #000 0, transparent 72%);
            mask:radial-gradient(circle at center, #000 0, transparent 72%);}
  .radar-bg::after{content:""; position:absolute; left:50%; top:38%; width:190vmax; height:190vmax;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, rgba(206,69,2,.10), transparent 22%, transparent 100%);
    -webkit-mask:radial-gradient(circle at center, #000 0, transparent 60%);
            mask:radial-gradient(circle at center, #000 0, transparent 60%);
    animation:sweep 9s linear infinite; opacity:.7;}
  @keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.radar-bg::after{animation:none}}

  .shell{position:relative; z-index:1; max-width:1220px; margin:0 auto; padding:22px 20px 80px}

  /* ---- top bar ---- */
  .top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:26px}
  .brand{display:flex; align-items:center; gap:11px}
  .ping{width:12px; height:12px; border-radius:50%; background:var(--grn); position:relative; box-shadow:0 0 10px var(--grn)}
  .ping::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:1px solid var(--grn); animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .word{font-family:var(--mono); font-weight:700; font-size:24px; letter-spacing:.32em; margin:0}
  .word b{color:var(--grn)}
  .kicker{font-family:var(--mono); font-size:12.5px; letter-spacing:.34em; color:var(--dim2); text-transform:uppercase}
  .top .spacer{flex:1}
  .navlink{font-family:var(--mono); font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
    text-decoration:none; padding:8px 12px; border:1px solid var(--line); border-radius:999px; transition:.16s}
  .navlink:hover{color:var(--grn); border-color:var(--grn-dim)}

  /* ---- horizontal journey rail (left → right) ---- */
  .rail{display:flex; align-items:center; gap:0; margin:6px 0 30px; overflow-x:auto; padding-bottom:4px}
  .stn{display:flex; align-items:center; gap:11px; flex:0 0 auto; cursor:pointer; opacity:.5; transition:.2s}
  .stn .no{font-family:var(--mono); font-size:14px; width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center; border:1px solid var(--line2); color:var(--dim); background:var(--bg2); flex:0 0 auto}
  .stn .meta{display:flex; flex-direction:column; line-height:1.15}
  .stn .meta .t{font-weight:600; font-size:16px; letter-spacing:.02em}
  .stn .meta .s{font-family:var(--mono); font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim2)}
  .stn.on{opacity:1}
  .stn.on .no{border-color:var(--grn); color:var(--grn); box-shadow:0 0 0 3px rgba(206,69,2,.12), 0 0 18px rgba(206,69,2,.25)}
  .stn.done{opacity:.9}
  .stn.done .no{border-color:var(--cyan); color:var(--cyan)}
  .link{flex:1 1 40px; min-width:26px; height:1px; background:linear-gradient(90deg,var(--line2),transparent); margin:0 14px}
  .link.lit{background:linear-gradient(90deg,var(--cyan),var(--grn))}

  /* ---- the sliding track: two viewports, journey moves L→R ---- */
  .viewport{overflow:hidden; border-radius:var(--r)}
  .track{display:flex; width:200%; transition:transform .6s cubic-bezier(.7,.02,.2,1)}
  .track.at-ideas{transform:translateX(-50%)}
  .stage{width:50%; flex:0 0 50%; padding:2px}

  .intro{font-family:var(--mono); font-size:14px; letter-spacing:.05em; color:var(--dim); margin:0 0 18px; max-width:70ch}
  .intro b{color:var(--txt)}

  /* ---- route modules row (left→right on desktop) ---- */
  .routes{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start}
  @media (max-width:900px){.routes{grid-template-columns:1fr}}
  .mod{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:18px; backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); transition:.22s}
  .mod.sel{border-color:var(--grn); box-shadow:0 0 0 1px rgba(206,69,2,.35), 0 14px 40px -20px rgba(206,69,2,.5)}
  .mod.soon{opacity:.92}
  .mod h3{margin:0; font-size:18px; font-weight:600; display:flex; align-items:center; gap:9px}
  .mod .idx{font-family:var(--mono); font-size:12px; letter-spacing:.24em; color:var(--dim2); display:block; margin-bottom:9px; text-transform:uppercase}
  .mod .desc{font-size:14.5px; color:var(--dim); margin:8px 0 14px; line-height:1.5}
  .tick{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line2); display:inline-grid; place-items:center;
    cursor:pointer; flex:0 0 auto; color:transparent; transition:.16s; font-size:14px; background:var(--bg2)}
  .mod.sel .tick{background:var(--grn); border-color:var(--grn); color:#fff}
  .badge-soon{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);
    border:1px solid rgba(199,123,43,.4); border-radius:999px; padding:3px 8px}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-family:var(--mono); font-size:13px; letter-spacing:.02em; color:var(--dim);
    border:1px solid var(--line2); border-radius:999px; padding:6px 11px; background:var(--bg2); cursor:default}
  .chip.pick{cursor:pointer; transition:.15s}
  .chip.pick:hover{border-color:var(--grn-dim); color:var(--txt)}
  .chip.on{background:var(--grn); border-color:var(--grn); color:#fff; font-weight:700}
  .chip .x{color:var(--red); cursor:pointer; margin-left:5px; text-decoration:none}
  .chip.tag-grn{color:var(--grn); border-color:rgba(206,69,2,.4)}
  .chip.tag-cyan{color:var(--cyan); border-color:rgba(0,84,101,.4)}
  .chip.tag-amber{color:var(--amber); border-color:rgba(199,123,43,.4)}
  .chip.tag-mag{color:var(--mag); border-color:rgba(181,49,110,.4)}
  a.chip{text-decoration:none}

  /* inputs / buttons */
  textarea,input[type=text],input:not([type]){
    width:100%; font-family:var(--sans); font-size:15px; color:var(--txt);
    background:#fff; border:1px solid var(--line2); border-radius:10px; padding:10px 12px; resize:vertical}
  textarea:focus,input:focus{outline:none; border-color:var(--grn-dim); box-shadow:0 0 0 3px rgba(206,69,2,.1)}
  ::placeholder{color:var(--dim2)}
  label.fld{font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim2); display:block; margin:12px 0 5px}
  .btn{font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    border:1px solid var(--line2); background:#fff; color:var(--txt); border-radius:10px; padding:9px 14px; transition:.16s}
  .btn:hover{border-color:var(--grn-dim); color:var(--grn)}
  .btn.small{padding:7px 11px; font-size:12px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}

  /* the sweep / process button */
  .process{margin:26px 0 6px; display:flex; justify-content:center}
  .sweep-btn{position:relative; overflow:hidden; font-family:var(--mono); font-weight:700; letter-spacing:.2em;
    text-transform:uppercase; font-size:15px; color:#fff; cursor:pointer; border:none; border-radius:999px;
    padding:16px 34px; background:linear-gradient(90deg,var(--grn),var(--cyan));
    box-shadow:0 10px 40px -12px rgba(206,69,2,.7)}
  .sweep-btn:disabled{opacity:.4; cursor:not-allowed}
  .sweep-btn::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:translateX(-120%);}
  .sweep-btn:hover::after{animation:shine 1.1s ease}
  @keyframes shine{to{transform:translateX(120%)}}

  /* radar meter (process progress) */
  .meter{margin-top:20px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:18px; backdrop-filter:blur(8px)}
  .meter .bar{height:6px; border-radius:999px; background:var(--line); overflow:hidden}
  .meter .fill{height:100%; width:0; background:linear-gradient(90deg,var(--grn),var(--cyan)); transition:width .4s ease; box-shadow:0 0 14px var(--grn)}
  .meter .now{font-family:var(--mono); font-size:14px; color:var(--grn); margin:12px 0 8px; letter-spacing:.06em}
  .ms{font-family:var(--mono); font-size:13.5px; color:var(--dim2); padding:3px 0}
  .ms.done{color:var(--cyan)}

  /* ideas panel */
  .ideas-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .ideas-head select{font-family:var(--mono); font-size:13px; color:var(--txt); background:#fff;
    border:1px solid var(--line2); border-radius:8px; padding:7px 10px}
  .empty{font-family:var(--mono); font-size:14px; color:var(--dim2); border:1px dashed var(--line2); border-radius:var(--r); padding:40px; text-align:center}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px}
  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px;
    backdrop-filter:blur(9px); transition:.18s}
  .card:hover{border-color:var(--line2)}
  .card.used{border-color:var(--grn); box-shadow:0 0 0 1px rgba(206,69,2,.25)}
  .card.saved{border-color:var(--amber)}
  .card.rejected{opacity:.55}
  .rank{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--grn); display:inline-flex; align-items:baseline; gap:6px}
  .rank .pct{font-size:22px}
  .card h4{margin:8px 0 6px; font-size:18px; font-weight:600; line-height:1.3}
  .card .sum{font-size:15px; color:var(--dim); line-height:1.55; margin:8px 0}
  .guide{border-top:1px solid var(--line); margin-top:12px; padding-top:12px}
  .guide .g-l{font-family:var(--mono); font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim2); margin-bottom:5px}
  .guide ul{margin:6px 0 0; padding-left:16px; font-size:14.5px; color:var(--dim); line-height:1.5}
  .score{display:flex; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:12px; color:var(--dim2); margin-top:12px}
  .score b{color:var(--cyan); font-weight:400}
  .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center}
  .acts .build{margin-left:auto; font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:6px; cursor:pointer}
  .flag{color:var(--mag)}

  /* modal */
  .ov{position:fixed; inset:0; z-index:50; background:rgba(0,24,31,.42); backdrop-filter:blur(4px); display:grid; place-items:center; padding:20px}
  .ov .box{width:min(440px,100%); background:var(--panel-solid); border:1px solid var(--line2); border-radius:var(--r); padding:22px; box-shadow:0 30px 80px -30px #000}
  .ov h3{margin:0 0 6px; font-size:18px}
  .ov p{margin:0 0 12px; font-size:14.5px; color:var(--dim)}
  .foot{font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim2); text-align:center; margin-top:46px}

  /* ---- sub-nav (Sweep / Batches / Library) ---- */
  .subnav{display:flex; gap:4px; margin:2px 0 22px; border-bottom:1px solid var(--line)}
  .subnav button{font-family:var(--sans); font-size:15px; font-weight:600; color:var(--dim); background:none; border:none; border-bottom:2px solid transparent; padding:9px 14px; cursor:pointer; transition:.16s}
  .subnav button:hover{color:var(--txt)}
  .subnav button.on{color:var(--grn); border-bottom-color:var(--grn)}
  .subnav .count{font-size:12px; color:var(--dim2); margin-left:5px}

  /* ---- batches list ---- */
  .batch-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.16s}
  .batch-row:hover{border-color:var(--grn-dim); transform:translateY(-1px)}
  .batch-row .bn{font-weight:600; font-size:16px; color:var(--txt); flex:1; min-width:160px}
  .batch-row .bm{font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; color:var(--dim2)}

  /* ---- expandable story reason ---- */
  .card .cardhead{cursor:pointer}
  .card .reason{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:12px}
  .card.open .reason{display:block}
  .card .why{font-size:14.5px; color:var(--dim); margin-top:6px; line-height:1.5}
  .card .why b{color:var(--txt)}
  .card .expand{font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; color:var(--grn); margin-top:10px; user-select:none}
  .sbar{display:grid; grid-template-columns:92px 1fr 40px; gap:8px; align-items:center; margin:5px 0; font-family:var(--mono); font-size:12.5px; color:var(--dim)}
  .sbar .track2{height:6px; border-radius:999px; background:var(--bg2); overflow:hidden}
  .sbar .fill2{height:100%; background:linear-gradient(90deg,var(--grn),var(--cyan))}
  .lib-filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
  .lib-filters select{font-family:var(--mono); font-size:13px; color:var(--txt); background:#fff; border:1px solid var(--line2); border-radius:8px; padding:7px 10px}

  /* concept editor */
  .ceditlink{font-size:11px;color:var(--grn);cursor:pointer;margin-left:8px;font-weight:600}
  /* full-screen concept editor overlay */
  .cmodal-ov{position:fixed;inset:0;z-index:200;background:rgba(0,36,46,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow:auto}
  .cmodal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:min(1040px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,36,46,.22)}
  .cmodal-h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:var(--r) var(--r) 0 0}
  .cmodal-h b{font-size:16px}
  .cmodal-s{display:block;font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:3px}
  .cmodal-b{padding:16px 22px 24px;overflow:auto}
  .cmodal-b .cedit{grid-template-columns:1.2fr 2.4fr 1fr 52px auto auto}
  .cedit-wrap{margin-top:10px}
  .cedit{display:grid;grid-template-columns:1.1fr 2fr 1fr 46px auto auto;gap:6px;align-items:center;margin-bottom:6px}
  .cedit input{font-size:12px;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:#fff}
  .ct-cell{display:flex;gap:5px;align-items:center;min-width:0}
  .ct-cell input{flex:1;min-width:0}
  .sugg{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer;line-height:1;transition:.14s}
  .sugg:hover{border-color:var(--org);background:var(--tint)} .sugg:disabled{opacity:.5;cursor:default}
  .cedit-h span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
  @media(max-width:640px){.cedit{grid-template-columns:1fr 1fr}.cedit-h{display:none}}

  /* explainable-AI (e) badge */
  .exp{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--grn);color:var(--grn);font-size:11px;font-weight:700;font-style:italic;cursor:pointer;flex:0 0 auto;transition:.15s;line-height:1}
  .exp:hover{background:var(--grn);color:#fff}

  /* source attribution */
  .srcrow{font-size:11px;color:var(--dim2);margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .src{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--cyan);border:1px solid rgba(0,84,101,.35);border-radius:6px;padding:2px 7px;background:#fff}
  .src.src-llm{color:var(--grn);border-color:rgba(206,69,2,.35)}

  /* sweep top row: batches dropdown + gates link */
  .sweeptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
  .batchpick{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase}
  .batchpick select{font-family:var(--sans);font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:220px}
  .gateslink{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--grn);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;transition:.16s}
  .gateslink:hover{border-color:var(--grn-dim);background:var(--bg2)}

  /* Trend Spotting report — clean sectioned blocks (above the idea cards) */
  .tsr{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:0 0 18px;overflow:hidden;box-shadow:0 12px 34px -26px rgba(0,36,46,.35)}
  .tsr-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:14px 18px;cursor:pointer;list-style:none;user-select:none;background:linear-gradient(180deg,#FFFBF8,#fff);transition:background .15s}
  .tsr-top::-webkit-details-marker{display:none}
  .tsr-top:hover{background:#FFF3EC}
  .tsr[open] .tsr-top{border-bottom:1px solid var(--line)}
  .tsr-top .ic-wrap{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--grn);color:#fff;flex:0 0 auto}
  .tsr-title{font-weight:700;font-size:15px;color:var(--txt);flex:0 0 auto}
  .tsr-hi{flex:1;min-width:140px;font-size:12.5px;color:var(--dim);letter-spacing:.01em;line-height:1.4}
  .tsr-hi b{color:var(--grn);font-weight:600}
  .tsr-chev{flex:0 0 auto;color:var(--dim2);font-size:12px;font-family:var(--mono);transition:transform .2s}
  .tsr[open] .tsr-chev{transform:rotate(180deg)}
  .tsr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;padding:16px 18px}
  .tsr-block{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:13px 14px;min-width:0}
  .tsr-block.span2{grid-column:span 2}
  @media(max-width:560px){.tsr-block.span2{grid-column:auto}}
  .tsr-k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .tsr-k .n{margin-left:auto;color:var(--grn);font-weight:700}
  .tsr-chips{display:flex;flex-wrap:wrap;gap:7px}
  /* right padding was 6px against ITALIC text (.mut) — the last glyph leaned
     out of the box and got clipped, and line-height:1 cut descenders. */
  .tsr-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:999px;padding:5px 13px;line-height:1.45;max-width:100%;white-space:normal;overflow:visible}
  .tsr-chip .t{overflow:visible}
  .tsr-chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tsr-chip b{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#FFF1E9;color:var(--grn);font-size:11px;font-weight:700;flex:0 0 auto}
  .tsr-chip.mut{color:var(--dim2);border-style:dashed}
  /* tiles were flex:1 with a 64px floor — seven of them squeezed to ~60px and
     clipped their labels ("COLLECTED" → "COLLECTE"). Grid with a real minimum
     lets them wrap onto a second row instead of crushing. */
  .tsr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
  .tsr-tile{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-width:0;overflow:visible}
  .tsr-tile .v{font-size:20px;font-weight:700;color:var(--txt);line-height:1}
  /* tile captions: 9.5px light grey was unreadable — bigger, bolder, darker */
  .tsr-tile .l{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--dim);margin-top:6px;line-height:1.35;white-space:normal;word-break:normal;overflow-wrap:break-word}
  /* plain-English score explainer */
  .sx{grid-column:1/-1}
  .sx-r{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.6}
  .sx-k{font-weight:700;color:var(--txt);display:flex;gap:7px;align-items:baseline}
  .sx-v{font-family:var(--mono);font-size:12px;color:var(--grn);font-weight:700}
  @media(max-width:640px){.sx-r{grid-template-columns:1fr;gap:2px}}
  .tsr-note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:9px}
  .tsr-note b{color:var(--txt)}

  /* ============ FEED SIGNAL — top scoring videos/posts (results page) ======= */
  .fsig{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 18px}
  .fsig>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
  .fsig>summary::-webkit-details-marker{display:none}
  .fsig-k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grn);font-weight:700}
  .fsig-n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
  .fsig-note{font-family:var(--mono);font-size:11.5px;color:var(--dim2);margin:8px 0 6px}
  /* source tabs (YouTube · Reddit · SEO) */
  .fsig-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .ft{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:4px 12px;cursor:pointer;transition:.14s}
  .ft b{color:var(--dim2);font-weight:700;margin-left:2px}
  .ft:hover{border-color:var(--cyan)}
  .ft.on{background:var(--cyan);color:#fff;border-color:var(--cyan)} .ft.on b{color:rgba(255,255,255,.75)}
  .fsig-rows[data-tab="youtube"] .fsig-row:not([data-g="youtube"]),
  .fsig-rows[data-tab="reddit"] .fsig-row:not([data-g="reddit"]),
  .fsig-rows[data-tab="seo"] .fsig-row:not([data-g="seo"]),
  .fsig-rows[data-tab="other"] .fsig-row:not([data-g="other"]){display:none}
  .fsig-row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-top:1px solid var(--line);text-decoration:none;color:var(--txt);transition:.14s}
  .fsig-row:hover{background:var(--bg2)}
  .fsig-rank{font-family:var(--mono);font-size:12px;color:var(--dim2);width:26px;flex:0 0 auto}
  .fsig-src{font-size:15px;flex:0 0 auto}
  .fsig-main{flex:1;min-width:0}
  .fsig-title{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsig-why{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
  .fsig-vel{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--grn)}
  .fsig-bar{width:54px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden;display:inline-block}
  .fsig-bar>span{display:block;height:100%;background:var(--grn-dim)}
  .fsig-ext{color:var(--dim2);flex:0 0 auto}
  /* coverage / validity strip */
  .fsig-stats{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .fst{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--dim);background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:3px 9px}
  .fst b{color:var(--txt);font-weight:700}
  .fst.on{border-color:var(--cyan);color:var(--cyan)} .fst.on b{color:var(--cyan)}
  .fst.off{border-color:var(--amber);color:var(--amber)} .fst.off b{color:var(--amber)}
  .fsig-match{color:var(--cyan)}
  /* dropped (off-topic) list */
  .fsig-row.drop{opacity:.6} .fsig-row.drop .fsig-title{font-weight:500;text-decoration:line-through;text-decoration-color:var(--line2)}
  .fsig-dropped{margin-top:8px;border-top:1px dashed var(--line2);padding-top:6px}
  .fsig-dropped>summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim2);padding:6px 0}
  .fsig-dropped>summary::-webkit-details-marker{display:none}
  .fsig-dropped[open]>summary{color:var(--amber)}

  /* ============ FACT-CHECK badge (results page, per idea) =================== */
  .factcheck{margin:12px 0 0;border:1px solid var(--line);border-left:3px solid var(--dim2);border-radius:10px;padding:10px 12px;background:var(--bg2)}
  .factcheck.fc-good{border-left-color:var(--cyan)} .factcheck.fc-ok{border-left-color:var(--amber)}
  .factcheck.fc-warn{border-left-color:var(--amber)} .factcheck.fc-bad{border-left-color:var(--red)}
  .fc-top{display:flex;align-items:center;gap:10px}
  .fc-score{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--txt)}
  .fc-out{color:var(--dim2);font-weight:400}
  .fc-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
  .fc-good .fc-label{color:var(--cyan)} .fc-bad .fc-label{color:var(--red)} .fc-warn .fc-label,.fc-ok .fc-label{color:var(--amber)}
  .fc-why{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px}
  .fc-revs{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .fc-rev{font-size:11.5px;color:var(--cyan);text-decoration:none} .fc-rev:hover{text-decoration:underline}

  /* ============ STORY BOARDS (grouped: concept → lead idea + alternatives) === */
  .boards{display:flex;flex-direction:column;gap:18px}
  .board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;box-shadow:0 1px 2px rgba(0,36,46,.04);transition:.16s}
  .board:hover{border-color:var(--line2)}
  .board.used{border-color:var(--grn);box-shadow:0 0 0 1px rgba(206,69,2,.2)}
  .board.saved{border-color:var(--amber)}
  .board-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .board-rank{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--grn);display:inline-flex;align-items:baseline;gap:5px}
  .board-rank .pct{font-size:20px}
  .board-kind{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
  .board-q{margin:2px 0 3px;font-size:20px;font-weight:700;line-height:1.28;color:var(--txt)}
  .board-qq{font-size:14px;color:var(--cyan);line-height:1.45;margin:0 0 7px}
  .board-qq b{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);font-weight:400;margin-right:6px}
  .board-sum{font-size:15px;color:var(--dim);line-height:1.55;margin:0 0 6px}
  .board-sum .lede{color:var(--dim2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}

  /* inline "why" expanders — used at concept, angle, and story level */
  .whyx{margin:6px 0 0}
  .whyx>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--grn);padding:3px 9px;border:1px solid var(--line2);border-radius:999px;transition:.14s;user-select:none}
  .whyx>summary::-webkit-details-marker{display:none}
  .whyx>summary:hover{border-color:var(--grn-dim);background:var(--bg2)}
  .whyx>summary .q{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--grn);font-size:9px;font-style:italic;font-weight:700}
  .whyx[open]>summary{background:var(--grn);color:#fff;border-color:var(--grn)}
  .whyx[open]>summary .q{border-color:#fff}
  .whyx-b{margin:8px 0 2px;padding:11px 13px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--dim);line-height:1.6}
  .whyx-b b{color:var(--txt);font-weight:600}

  /* lead idea block */
  .lead-label,.alts-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin:16px 0 8px}
  .lead-label{color:var(--grn)}
  .lead{border:1px solid rgba(206,69,2,.3);border-left:3px solid var(--grn);border-radius:12px;padding:14px 15px;background:linear-gradient(180deg,#FFFBF8,#fff)}
  .idea-topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .idea-h{font-size:16px;font-weight:600;line-height:1.35;margin:2px 0 8px}
  .idea-score{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--grn);font-weight:700}
  .why-pair{display:flex;gap:8px;flex-wrap:wrap}

  /* alternatives */
  .alt{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px;overflow:hidden;transition:.14s}
  .alt:hover{border-color:var(--line2)}
  .alt>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;user-select:none}
  .alt>summary::-webkit-details-marker{display:none}
  .alt>summary .caret{font-family:var(--mono);color:var(--dim2);transition:.2s;flex:0 0 auto}
  .alt[open]>summary .caret{transform:rotate(90deg)}
  .alt>summary .ah{font-size:14px;font-weight:600;color:var(--txt);flex:1;min-width:120px;line-height:1.35}
  .alt-score{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:700}
  .alt-body{padding:0 14px 14px;border-top:1px solid var(--line)}
  .mklead{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grn);background:none;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;cursor:pointer;transition:.14s;flex:0 0 auto}
  .mklead:hover{border-color:var(--grn-dim);background:var(--bg2)}
  .board .acts{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
  .angle-core{color:var(--grn);border-color:rgba(206,69,2,.4)}
  .angle-contrarian{color:var(--amber);border-color:rgba(199,123,43,.45)}
  .angle-insider-data{color:var(--mag);border-color:rgba(181,49,110,.45)}
  .board .why{font-size:14px;color:var(--dim);margin-top:6px;line-height:1.5}
  .board .why b{color:var(--txt)}
  .board .whyx-b ul{margin:6px 0 0;padding-left:16px;line-height:1.5}

  /* box-in-box: the actual sources we gathered, each opens in a new window */
  .srcbox{margin:12px 0 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:11px 13px}
  .srcbox-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .srclink{display:flex;align-items:center;gap:9px;text-decoration:none;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px;transition:.14s}
  .srclink:last-child{margin-bottom:0}
  .srclink:hover{border-color:var(--grn-dim);background:#FFFBF8}
  .srclink .stag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,84,101,.3);border-radius:5px;padding:2px 6px;flex:0 0 auto;white-space:nowrap}
  .srclink .stag.seo{color:var(--grn);border-color:var(--grn-dim);background:var(--tint)}
  .srclink .svia{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
  .srclink .stt{font-size:13px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
  .srclink .sgo{font-family:var(--mono);font-size:11px;color:var(--grn);flex:0 0 auto}
  .srcbox-empty{font-family:var(--mono);font-size:11px;color:var(--dim2);line-height:1.5}

  /* pipeline trace — grey box, box-in-box, step by step (why an idea was built) */
  .trace{margin:10px 0 2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .tstep{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .tstep:last-child{margin-bottom:0}
  .tstep-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .tstep-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--grn);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto}
  .tstep-name{font-weight:600;font-size:13.5px;color:var(--txt)}
  .tstep-pipe{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--cyan);background:#eef4f5;border:1px solid rgba(0,84,101,.2);border-radius:999px;padding:2px 8px}
  .tstep-row{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12.5px;line-height:1.55;padding:4px 0;border-top:1px dashed var(--line)}
  .tstep-row:first-of-type{border-top:none}
  .tstep-row .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);padding-top:3px}
  .tstep-row .tv{color:var(--dim);min-width:0;overflow-wrap:anywhere}
  .tstep-row .tv b{color:var(--txt);font-weight:600}
  .tstep-row .tv .src{margin:0 5px 3px 0}
  .tstep-row .tv a.src:hover{border-color:var(--grn-dim)}
  .tbeats{margin:2px 0 0;padding-left:15px}
  .tbeats li{margin:2px 0}

  /* the deliverable — the catchy optimized title + headline, boxed & prominent */
  .deliv{border:1px solid rgba(206,69,2,.28);background:linear-gradient(180deg,#FFF7F2,#fff);border-radius:12px;padding:12px 14px;margin:2px 0 12px}
  .deliv-k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grn);margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .deliv-row{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px dashed var(--line)}
  .deliv-row:first-of-type{border-top:none;padding-top:0}
  .deliv .dl{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2)}
  .deliv .dtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .deliv .dv{font-size:17px;font-weight:600;line-height:1.32;color:var(--txt);flex:1;min-width:0}
  .deliv .dv.title{font-size:15px}
  .deliv .cpy{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grn);background:none;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;cursor:pointer;flex:0 0 auto;transition:.14s}
  .deliv .cpy:hover{border-color:var(--grn-dim);background:var(--bg2)}

  /* the user's free-text sweep brief box */
  .sweepbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:6px 0 0}
  .sweepbox textarea{margin-top:6px;color:var(--txt)}
  .sweepbox textarea::placeholder{color:#b8b2a8}

  /* footer credit: an AI product by TKB (3x) */
  .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;text-align:left}
  .foot .byline{display:inline-flex;align-items:center;gap:9px;text-transform:none;letter-spacing:.02em;color:var(--dim);font-size:12px;text-decoration:none;transition:.16s}
  .foot a.byline:hover{color:var(--grn)}
  .foot .tkb{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:.01em;color:var(--grn);line-height:1}
  .foot img.tkb{height:30px;width:auto}

  /* rotating Pot logo — shown wherever AI is processing */
  .potspin{width:22px;height:22px;vertical-align:-.4em;margin-right:9px;display:inline-block;animation:potspin 1s linear infinite}
  @keyframes potspin{to{transform:rotate(360deg)}}
  .rd-meter .fill.indet,.meter .fill.indet{background:linear-gradient(90deg,var(--grn),var(--cyan),var(--grn));background-size:200% 100%;animation:indet 1.1s linear infinite}
  @keyframes indet{to{background-position:-200% 0}}

  /* ===== RECAP — "what went into this sweep" ============================== */
  .rcp-row{display:grid;grid-template-columns:minmax(140px,190px) 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .rcp-row:first-of-type{border-top:0}
  .rcp-c{font-size:12.5px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
  .rcp-fr{font-size:10.5px;font-weight:500;color:var(--dim2)}
  .rcp-t{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .rcp-term{font-size:11.5px;padding:4px 11px;border:1px solid var(--line2);border-radius:999px;color:var(--dim);background:var(--bg2);line-height:1.45;white-space:normal}
  .rcp-term.mut,.rcp .mut{color:var(--dim2);font-style:italic;padding-right:13px}
  .rcp-prev{font-size:11.5px;color:var(--dim2);line-height:1.5}
  .rcp-brief{font-size:12.5px;line-height:1.6;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  @media(max-width:640px){.rcp-row{grid-template-columns:1fr;gap:4px}}

  /* ===== JOURNEY — the gated, high-involvement lane ======================= */
  .jn-head{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:2px 0 14px}
  .jn-sel{padding:7px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);font:inherit;font-size:12.5px;color:var(--txt);min-height:38px}
  .jny{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;overflow:hidden}
  .jny.on{border-color:var(--grn-dim);box-shadow:0 1px 0 rgba(206,69,2,.08)}
  .jny-top{display:flex;gap:11px;align-items:center;padding:13px 14px;cursor:pointer;list-style:none}
  .jny-top::-webkit-details-marker{display:none}
  .jny-n{font-size:11px;font-weight:700;color:var(--grn);border:1px solid var(--grn-dim);border-radius:8px;padding:3px 7px;flex:none}
  .jny-t{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .jny-s{font-size:11.5px;color:var(--dim2)}
  .jny-owner{font-size:10.5px;font-weight:600;color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
  .jny-count{margin-left:auto;font-size:11.5px;color:var(--dim2);display:flex;gap:7px;align-items:center}
  .jny-count b{color:var(--txt);font-size:13px}
  .jny-body{padding:0 14px 14px;border-top:1px solid var(--line)}
  .batch-row .bn{display:flex;flex-direction:column;gap:3px}
  .batch-row .bd{font-size:11.5px;font-weight:400;color:var(--dim);line-height:1.45}
  /* batch picker + big new-sweep CTA */
  .sweeptop{align-items:flex-end}
  .batchpick{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .newsweep-btn{font-size:14px;padding:11px 20px}
  .bp{display:flex;flex-direction:column;gap:4px;min-width:260px;flex:1}
  .bp-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2)}
  .bp select{min-width:260px;max-width:520px}
  /* journey opener — start or reopen without leaving the page */
  .jopen{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;margin-bottom:16px}
  .jopen-r{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .jopen-f{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .jopen-f>summary{cursor:pointer;font-size:12px;color:var(--dim);list-style:none}
  .jopen-f>summary::-webkit-details-marker{display:none}
  .jopen-f>summary::before{content:"▸ ";color:var(--grn)}
  .jopen-f[open]>summary::before{content:"▾ "}
  .jopen-fb{font-size:12.5px;line-height:1.6;color:var(--dim);margin:8px 0 10px}
  .jopen-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .jopen-c{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:10px 12px}
  .jopen-c b{display:block;font-size:12.5px;margin-bottom:4px}
  .jopen-c span{font-size:11.5px;line-height:1.55;color:var(--dim)}

  /* the door from Journey 1 (sweep) to Journey 2 (the tracked lane) */
  .jcta{margin:18px 0;padding:18px 20px;border:1.5px solid var(--grn-dim);border-radius:var(--r);
    background:linear-gradient(180deg,rgba(206,69,2,.07),rgba(206,69,2,.02));text-align:center}
  .jcta-t{font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--txt);margin-bottom:6px}
  .jcta-s{font-size:13.5px;line-height:1.65;color:var(--dim);max-width:66ch;margin:0 auto 14px}
  .jcta-b{font-size:14px}

  /* judged ideas drop into a drawer so the working list only holds live work */
  .donedrawer{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);padding:12px 14px}
  .donedrawer>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--dim);list-style:none}
  .donedrawer>summary::-webkit-details-marker{display:none}
  .donedrawer>summary::before{content:"▸ ";color:var(--grn)}
  .donedrawer[open]>summary::before{content:"▾ "}
  .donedrawer>summary:hover{color:var(--txt)}

  /* ===== LEGIBILITY PASS ==================================================
     Every text input across RayDar: bigger type (13.5px — 16px on mobile so
     iOS never zooms), a real minimum height, and a field background that is
     visibly DIFFERENT from the card behind it, so you can see where to type. */
  input[type=text],input:not([type]),input[type=url],input[type=number],input[type=date],textarea,select{
    font-family:var(--sans); font-size:13.5px; line-height:1.55; color:var(--txt);
    background:var(--bg2); border:1px solid var(--line2); border-radius:9px;
    padding:10px 12px; min-height:42px; width:100%; max-width:100%;
  }
  textarea{min-height:76px; resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--grn-dim); background:var(--panel);
    box-shadow:0 0 0 3px rgba(206,69,2,.10)}
  input::placeholder,textarea::placeholder{color:var(--dim2); opacity:.85}
  select{background:var(--bg2); cursor:pointer}
  /* field labels — small caps, clearly a label and not body copy */
  .fld{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.07em; color:var(--dim2); margin:12px 0 5px}
  @media(max-width:640px){
    input[type=text],input:not([type]),input[type=url],input[type=number],textarea,select{font-size:16px; min-height:46px}
  }
  /* ===== TITLE HIERARCHY — so headings actually read as headings ========== */
  .lib-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 16px;
    padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .lf{display:flex;flex-direction:column;gap:4px;min-width:132px;flex:0 1 auto}
  .lf-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2)}
  .lf select{min-width:132px}
  .lf-n{font-size:12px;color:var(--dim2);align-self:center;padding-bottom:10px}

  /* ===== THEME EDITOR — describe it, RayDar compiles the logic =========== */
  .tset-i{font-size:13px;line-height:1.65;color:var(--dim);margin:0 0 14px;max-width:78ch}
  .tcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 14px;margin-bottom:12px}
  .tcard-new{border-style:dashed;background:var(--bg2)}
  .tcard-h{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tcard-h input,.tcard-h select{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);font:inherit;font-size:13px;color:var(--txt);min-height:38px}
  .tcard-h input:first-child{flex:1;min-width:170px;font-weight:600}
  .tcard textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);font:inherit;font-size:13px;line-height:1.6;color:var(--txt);resize:vertical}
  .tcard-msg{font-size:11.5px;color:var(--grn);align-self:center}
  .tcomp{margin-top:11px;border:1px solid var(--line);border-left:3px solid var(--grn-dim);border-radius:10px;background:var(--bg2);padding:10px 12px}
  .tcomp-k{font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--txt);margin-bottom:8px;
    padding-bottom:6px;border-bottom:2px solid var(--grn-dim);display:inline-block}
  .tcomp-why{font-size:12px;color:var(--dim2);font-style:italic;line-height:1.55;margin-bottom:8px}
  .tcomp-r{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55}
  .tcomp-r:first-of-type{border-top:0}
  .tcomp-r .tk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);padding-top:4px}
  .tcomp-r .tv{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .tcomp-r .tv input{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font:inherit;font-size:12.5px;color:var(--txt)}
  .tcomp-n{font-size:11px;color:var(--dim2);line-height:1.5;width:100%}
  .tcomp-empty{margin-top:11px;border:1px dashed var(--line2);border-radius:10px;background:var(--bg2);padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--dim)}
  .tretired>summary{cursor:pointer;font-size:12px;color:var(--dim2);padding:6px 0}
  @media(max-width:640px){.tcomp-r{grid-template-columns:1fr;gap:3px}}

  /* "you are here" — the one thing to do next, in plain words */
  .jnext{border:1px solid var(--grn-dim);border-radius:var(--r);background:linear-gradient(180deg,rgba(206,69,2,.05),transparent);padding:14px 16px;margin-bottom:16px}
  .jnext-n{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--grn);margin-bottom:5px}
  .jnext-s{font-size:14px;line-height:1.6;color:var(--txt);max-width:74ch}
  .jnext-b{margin-top:11px}
  /* numbered "what to do here" — the hand-held bit */
  /* the how-to and the why both FOLD AWAY. A station opens showing its
     controls — the reading is there for whoever wants it, not in the way. */
  .jhow-w>summary,.jwhy-w>summary{cursor:pointer;font-size:12px;color:var(--dim);padding:6px 0;list-style:none}
  .jhow-w>summary::-webkit-details-marker{display:none}
  .jhow-w>summary::before{content:"▸ ";color:var(--grn)}
  .jhow-w[open]>summary::before{content:"▾ "}
  .jhow-w>summary:hover{color:var(--txt)}
  .jhow{margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:11px 13px}
  .jhow-k{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--txt);margin-bottom:8px;
    padding-bottom:7px;border-bottom:2px solid var(--grn-dim);display:inline-block}
  .jhow-l{margin:0;padding-left:20px;font-size:13px;line-height:1.75;color:var(--txt)}
  .jhow-l li{padding-left:2px;margin-bottom:2px}
  .jhow-l li::marker{color:var(--grn);font-weight:700}
  .jhow-g{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--dim)}
  .jhow-t{margin-top:5px;font-size:12px;color:var(--dim2);line-height:1.55;font-style:italic}
  /* the technical explainer folds away — curious users open it, nobody else has to */
  .jwhy-w>summary{cursor:pointer;font-size:11.5px;color:var(--dim2);padding:4px 0;list-style:none}
  .jwhy-w>summary::-webkit-details-marker{display:none}
  .jwhy-w>summary::before{content:"▸ ";color:var(--cyan)}
  .jwhy-w[open]>summary::before{content:"▾ "}
  .jwhy-w>summary:hover{color:var(--cyan)}
  /* the explainable-AI panel — always available, never in the way */
  .jwhy{margin:12px 0;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:10px;background:var(--bg2);padding:10px 12px}
  .jwhy-r{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.6}
  .jwhy-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);padding-top:3px}
  .jwhy-r.gate .jwhy-k{color:var(--grn)}
  .jwhy-r.gate div:last-child{font-weight:600}
  .jwhy-p{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:11px;color:var(--dim2);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .jwhy-p .pp{border:1px solid var(--line2);border-radius:999px;padding:1px 7px;background:var(--panel)}
  @media(max-width:640px){.jwhy-r{grid-template-columns:1fr;gap:1px}}
  /* a topic travelling the journey */
  .jrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .jrow-h{flex:1;min-width:190px;font-size:13px;font-weight:600;line-height:1.45}
  .jrow-m{font-size:11px;color:var(--dim2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .jrow-a{display:flex;flex-wrap:wrap;gap:6px}
  .jrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--grn);flex:none}
  .jv{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;color:var(--dim);min-height:34px}
  .jv:hover{border-color:var(--grn-dim);color:var(--grn)}
  .jv.keep{color:var(--grn);border-color:var(--grn-dim)} .jv.kill{color:var(--red)}
  .jv.refresh{color:var(--mag)} .jv.park{color:var(--amber)} .jv.merge{color:var(--cyan)}
  /* dump zone */
  .jdz{border:1.5px dashed var(--line2);border-radius:12px;padding:14px;text-align:center;background:var(--bg2);margin:10px 0}
  .jdz textarea{width:100%;min-height:64px;margin-bottom:9px}
  .jdump{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
  .jdump .st{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line2)}
  .jdump .st.attached{color:var(--grn);border-color:var(--grn-dim)}
  .jdump .st.confirm{color:var(--amber);border-color:var(--amber)}
  .jdump .det{color:var(--dim2);font-size:11px}
  /* brief artifact */
  .jbrief{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:9px;background:var(--bg2)}
  .jbrief-r{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55}
  .jbrief-r:first-child{border-top:0}
  .jbrief-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);padding-top:3px}
  @media(max-width:640px){.jbrief-r{grid-template-columns:1fr;gap:2px}}
  /* timeline */
  .jtl{margin-top:9px;border-left:2px solid var(--line2);padding-left:12px}
  .jtl-e{font-size:11.5px;color:var(--dim);padding:4px 0;line-height:1.5}
  .jtl-e b{color:var(--txt)} .jtl-e .t{color:var(--dim2);font-size:10.5px}
  </style>
</head>
<body>
  <div id="appbar"></div>
  <div class="radar-bg"></div>
  <div class="shell">
    <div class="brand" style="margin-bottom:12px">
      <span class="ping"></span>
      <div>
        <h1 class="word">RAY<b>DAR</b></h1>
        <div class="kicker">Talent Trend Radar</div>
      </div>
    </div>

    <div class="subnav" id="subnav"></div>

    <div id="view-sweep">
      <div class="sweeptop">
        <div class="batchpick" id="batchpick"></div>
        <a class="gateslink" href="#" onclick="setView('rules');return false" title="Edit the business rules that drive the sweep — RayDar's own dials">◈ Business rules</a>
      </div>
      <div class="rail" id="rail"></div>
      <div class="viewport">
        <div class="track" id="track">
          <section class="stage" id="stageHunger"></section>
          <section class="stage" id="stageIdeas"></section>
        </div>
      </div>
    </div>
    <div id="view-journey" hidden></div>
    <div id="view-batches" hidden></div>
    <div id="view-library" hidden></div>
    <div id="view-rules" hidden></div>

    <div class="foot">
      <span>RAYDAR // demand ↔ supply // routed to 1UP franchises</span>
      <a class="byline" href="https://thekettleblack.in" target="_blank" rel="noopener">Bespoke AI by
        <img src="/brand/assets/logos/tkb-logo.png" class="tkb" alt="TKB">
      </a>
    </div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("raydar");</script>
  <script src="/icons.js"></script>
  <script src="/whisperer.js"></script>
</body>
</html>
