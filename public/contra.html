<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contra — Contract Review</title>
  <link rel="icon" type="image/png" href="/q-emblem.png">
  <link rel="apple-touch-icon" href="/q-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  /* ===== Contra — self-contained. RayDar design language. ================== */
  :root{
    --bg:#F4F3EF; --bg2:#F9FAFB; --panel:#FFFFFF; --panel-solid:#FFFFFF;
    --line:#E7E3DC; --line2:#D9D3C8;
    --org:#CE4502; --org-dim:#FF5400; --tint:#FFF1E9;
    --cyan:#005465; --amber:#C77B2B; --mag:#6b3fa0; --red:#C0392B; --grn:#2E7D4F;
    --txt:#141414; --dim:#54504A; --dim2:#7A7266;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:var(--sans); --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--txt);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 720px at 84% -12%, rgba(206,69,2,.06), transparent 60%),
      radial-gradient(900px 700px at 6% 110%, rgba(0,84,101,.045), transparent 55%),
      linear-gradient(rgba(0,36,46,.028) 1px, transparent 1px) 0 0/100% 46px,
      linear-gradient(90deg, rgba(0,36,46,.024) 1px, transparent 1px) 0 0/46px 100%;}
  .shell{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding:22px 20px 80px}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .ping{width:12px;height:12px;border-radius:50%;background:var(--org);position:relative;box-shadow:0 0 10px var(--org)}
  .ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--org);animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .word{font-weight:700;font-size:24px;letter-spacing:.3em;margin:0}
  .word b{color:var(--org)}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--dim2);text-transform:uppercase}

  .mainnav{display:flex;gap:26px;margin:8px 0 14px}
  .mainnav button{font-family:var(--sans);font-size:18px;font-weight:700;color:var(--dim2);background:none;border:none;padding:6px 0;cursor:pointer;transition:.16s;letter-spacing:.01em}
  .mainnav button:hover{color:var(--txt)}
  .mainnav button.on{color:var(--txt);box-shadow:inset 0 -2px 0 var(--org)}
  .subnav{display:flex;gap:6px;margin:0 0 30px;border-bottom:1px solid var(--line)}
  .subnav button{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--dim);background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;cursor:pointer;transition:.16s}
  .subnav button:hover{color:var(--txt)}
  .subnav button.on{color:var(--org);border-bottom-color:var(--org)}
  .subnav .count{font-size:12px;color:var(--dim2);margin-left:5px}

  /* rules-as-chips (per section: type plain English → Enter → chip) */
  .rules{margin:2px 0 11px}
  .rules-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mag);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .rchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
  .rchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8a5a10;background:#FBF1E2;border:1px solid #EAD3AE;border-radius:999px;padding:4px 7px 4px 11px;line-height:1.3}
  .rchip .x{color:#B08640;cursor:pointer;text-decoration:none;font-weight:700}
  .rchip .x:hover{color:var(--red)}
  .rnone{font-size:11.5px;color:var(--dim2);font-style:italic}
  .rinput{width:100%;font-family:var(--sans);font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
  .rinput:focus{outline:none;border-color:var(--org-dim)}
  .backlnk{font-size:13px;color:var(--org);cursor:pointer;font-weight:600;margin-bottom:10px;display:inline-block}
  .grules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
  /* archetype meta: name · description · version */
  .arch-meta{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--org);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .arch-meta-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
  .metalbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);width:82px;flex:0 0 auto;padding-top:10px}
  .arch-meta input,.arch-meta textarea{flex:1;font-family:var(--sans);font-size:14px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
  .arch-meta textarea{resize:vertical;line-height:1.5}
  .arch-meta input:focus,.arch-meta textarea:focus,#verpick:focus{outline:none;border-color:var(--org-dim)}
  .arch-meta-row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
  .metastamp{font-family:var(--mono);font-size:11px;color:var(--dim2)}
  .metastamp b{color:var(--org)}
  #verpick{font-family:var(--sans);font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 10px}
  .viewnote{font-size:12px;color:var(--amber);background:#FBF6E7;border:1px solid #E7D8A8;border-radius:8px;padding:6px 10px}
  .adesc{font-size:12.5px;color:var(--dim);margin-top:3px;max-width:64ch;line-height:1.45}
  .vtag{font-family:var(--mono);font-size:10px;color:var(--org);background:var(--tint);border:1px solid #F3D6C2;border-radius:999px;padding:2px 7px;margin-left:6px}
  .rlbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:0 0 9px}

  /* ---- Contract Review: detect + archetype select chips ---- */
  .crow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .crow-h{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:14px}
  .crow-h.done{margin-bottom:0}
  .crow-h .cn{font-weight:600;font-size:15px}

  /* contract header (above the Reviewed tabs) */
  .chead{display:flex;align-items:flex-start;gap:15px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 12px 34px -26px rgba(0,36,46,.4)}
  .chead-emb{width:44px;height:44px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:0 0 auto}
  .chead-body{flex:1;min-width:0}
  .chead-titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chead-title{font-size:20px;font-weight:700;line-height:1.25;color:var(--txt)}
  .typebadge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--org);background:var(--tint);border:1px solid #F3D6C2;border-radius:999px;padding:3px 10px}
  .chead-parties{font-size:14px;color:var(--txt);margin-top:6px;font-weight:500}
  .chead-parties .vs{color:var(--dim2);margin:0 6px;font-weight:400}
  .chead-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:11px}
  .cfact{font-size:12.5px;color:var(--txt)}
  .cfact .cfk{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);display:block;margin-bottom:2px}
  .chead-issues{flex:0 0 auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 12px}
  .chead-issues.bad{color:var(--red);background:#FBECEB;border:1px solid #F0CFCF}
  .chead-issues.ok{color:var(--grn);background:#EAF3EC;border:1px solid #BCDBC5}
  .detbadge{font-size:11px;color:var(--cyan);background:#E6EEF0;border:1px solid rgba(0,84,101,.3);border-radius:999px;padding:2px 9px}
  .achip{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fff;transition:.14s}
  .achip:hover{border-color:var(--org-dim)}
  .achip.on{border:2px solid var(--org);background:#FFF7F1}
  .achip .tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
  .achip.on .tick{background:var(--org);border-color:var(--org)}
  .achip .an{font-weight:700;font-size:14.5px}
  .achip .ad{font-size:12px;color:var(--dim);margin-top:2px}
  .achip .aex{color:var(--dim2)}
  .dedupnote{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--dim);margin:11px 0}
  .createlink{font-size:12.5px;color:var(--org);font-weight:600;border:1px dashed #F3D6C2;border-radius:9px;padding:8px 12px;cursor:pointer}

  /* ---- Reviewed: report · boxes · verdicts · findings · timeline ---- */
  .rvtabs{display:flex;gap:8px;margin-bottom:16px;align-items:center}
  .rvtab{font-size:12.5px;font-weight:600;border:1px solid var(--line2);border-radius:9px;padding:7px 13px;cursor:pointer;background:#fff}
  .rvtab.on{background:#141414;color:#fff;border-color:#141414}
  .report-doc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 34px -26px rgba(0,36,46,.4)}
  .rd-head{display:flex;align-items:flex-start;gap:14px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
  .rd-emb{width:42px;height:42px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:0 0 auto}
  .rd-title{font-size:21px;font-weight:700}
  .rd-ref{font-family:var(--mono);font-size:11px;color:#A79F93;margin-top:3px}
  .vchip{font-size:10px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .v-present{color:#2E7D4F;background:#EAF3EC;border:1px solid #BCDBC5}
  .v-non_standard{color:#8a6d1f;background:#FBF6E7;border:1px solid #E7D8A8}
  .v-risky{color:#C77B2B;background:#FBF1E2;border:1px solid #EAD3AE}
  .v-missing{color:#C0392B;background:#FBECEB;border:1px solid #F0CFCF}
  .rbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .rbox .q{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.5}
  .ref{font-family:var(--mono);font-size:10px;color:var(--cyan);border:1px solid rgba(0,84,101,.3);border-radius:5px;padding:1px 5px;white-space:nowrap}
  /* clause chips — prominent, clickable §-refs for the legal team to jump to the clause */
  .clauses{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:6px;vertical-align:middle}
  .clausechip{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cyan);background:#EAF2F3;border:1px solid rgba(0,84,101,.28);border-radius:999px;padding:3px 10px;white-space:nowrap;line-height:1.4}
  .cl-lab{font-family:var(--sans);font-weight:500;font-size:10.5px;color:var(--dim)}
  .cl-lab::before{content:"·";margin-right:5px;color:var(--line2)}
  .rcheck{display:flex;align-items:center;gap:9px;border-radius:9px;padding:8px 11px;font-size:12.5px;margin-bottom:6px;line-height:1.4}
  .rc-pass{background:#EAF3EC;border:1px solid #BCDBC5}
  .rc-check{background:#FBF6E7;border:1px solid #E7D8A8}
  .rc-breach{background:#FBECEB;border:1px solid #F0CFCF}
  .rcbadge{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#fff;flex:0 0 auto}
  .fband{background:#FDF8F1;border:1px solid #EAD3AE;border-left:3px solid #C77B2B;border-radius:12px;padding:13px 15px;margin:14px 0}
  .fitem{background:#fff;border:1px solid #EFE0C8;border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:7px}
  .tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px;display:flex;flex-direction:column;gap:10px}
  .tl-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .tl-dot{position:absolute;left:-24px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
  .tl-ai .tl-dot{background:var(--mag)} .tl-human .tl-dot{background:var(--cyan)}
  .tl-badge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px}
  .tl-stamp{font-family:var(--mono);font-size:10px;color:#9a938a;margin-top:5px}
  /* clean report: at-a-glance, rule rows, findings, section chips */
  .glance{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .glance .g{background:#fff;padding:13px 16px}
  .glance .gv{font-size:24px;font-weight:700;line-height:1}
  .glance .gl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin-top:3px}
  @media(max-width:640px){.glance{grid-template-columns:repeat(2,1fr)}}
  .rsec-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:0 0 11px}
  .rsummary{margin:0 0 22px;font-size:14px;color:#3a3a3a;line-height:1.7}
  .rcrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 11px;padding:9px 0;border-top:1px solid #F0EDE7}
  .rcrow:last-child{border-bottom:1px solid #F0EDE7}
  .rcp{font-size:10px;font-weight:700;border-radius:4px;padding:3px 8px;min-width:58px;text-align:center;flex:0 0 auto}
  .rcp.pass{color:#2E7D4F;background:#EAF3EC}.rcp.check{color:#8a6d1f;background:#FBF6E7}.rcp.breach{color:#C0392B;background:#FBECEB}
  .frow{padding:2px 0 2px 12px;margin-bottom:11px;font-size:13px;color:var(--dim);line-height:1.5;border-left:2px solid var(--line2)}
  .frow.hi{border-left-color:#C0392B}.frow.med{border-left-color:#C77B2B}
  .frow b{color:var(--txt)}
  .schip{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:.14s}
  .schip:hover{border-color:var(--line2);background:#FFFBF8}
  .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  /* compact filterable tables (Library + Reviewed history) */
  .cfilter{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .cfilter input{font-family:var(--sans);font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:10px 13px;min-width:240px}
  .cfilter input:focus{outline:none;border-color:var(--org-dim)}
  .ctable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ctable th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;background:var(--bg2)}
  .ctable td{padding:15px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--txt);vertical-align:top;line-height:1.5}
  .ctable tr:last-child td{border-bottom:none}
  .ctable tr.clk{cursor:pointer}
  .ctable tr.clk:hover td{background:#FFFBF8}
  .ctable .tdesc{color:var(--dim);font-size:12px;max-width:44ch;line-height:1.4}
  .ctable .tacts{white-space:nowrap;text-align:right}
  .tl-summary{font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.04em;margin-bottom:12px}
  /* Ask Contract (box-in-box) + box actions */
  .askbox{background:#FBF7FF;border:1px solid #E7DBF3;border-radius:12px;padding:13px 15px;margin-bottom:16px}
  .askbox-h{font-weight:600;font-size:13.5px;color:#6b3fa0;display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .askbox-s{font-family:var(--mono);font-size:10px;color:#9b86bf;font-weight:400;letter-spacing:.04em}
  .askbox-a{background:#fff;border:1px solid #EBE3F5;border-radius:9px;padding:10px 12px;margin-bottom:9px}
  .askbox-q{font-size:12.5px;font-weight:600;color:#141414;margin-bottom:4px}
  .askbox-ans{font-size:12.5px;color:var(--dim);line-height:1.55}
  .askbox-in{display:flex;gap:8px}
  .askbox-in input{flex:1;font-family:var(--sans);font-size:13px;color:var(--txt);background:#fff;border:1px solid #E7DBF3;border-radius:9px;padding:9px 12px}
  .askbox-in input:focus{outline:none;border-color:#6b3fa0}
  .rbox-acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}

  .intro{font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:var(--dim);margin:0 0 22px;max-width:74ch;line-height:1.6}
  .intro b{color:var(--txt)}
  .gateslink{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--org);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;transition:.16s}
  .gateslink:hover{border-color:var(--org-dim);background:var(--bg2)}

  /* dropzone */
  .drop{border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--panel);padding:26px 22px;margin:0 0 20px;display:flex;align-items:center;gap:16px;transition:.16s;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--org-dim);background:#FFFBF8}
  .drop .ic{width:44px;height:44px;border-radius:11px;background:var(--tint);color:var(--org);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
  .drop .t{font-weight:600;font-size:15.5px}
  .drop .s{font-size:12.5px;color:var(--dim);margin-top:2px}
  .drop input{display:none}

  /* section cards (the review outline being built) */
  .sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
  .sec-head h3{margin:0;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;transition:.16s}
  .sec.req{border-color:rgba(206,69,2,.4);box-shadow:0 0 0 1px rgba(206,69,2,.08)}
  .sec-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .sec-top .ord{font-family:var(--mono);font-size:11px;color:var(--dim2)}
  .sec-top .lbl{font-weight:600;font-size:15px;flex:1;min-width:0}
  .sec .chk{font-size:12.5px;color:var(--dim);line-height:1.5;margin:0 0 12px}
  .sec-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .reqtag{font-size:10.5px;font-weight:700;letter-spacing:.05em;border-radius:999px;padding:4px 11px;cursor:pointer;border:1px solid transparent;transition:.14s;user-select:none}
  .reqtag.on{background:var(--org);color:#fff}
  .reqtag.off{background:var(--bg2);color:var(--dim2);border-color:var(--line2)}
  .lnk{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;background:none}
  .lnk:hover{border-color:var(--line2);color:var(--txt)}
  .lnk.del{color:var(--red);margin-left:auto}

  .savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--org);border-radius:12px;padding:14px 16px}
  .savebar input{font-family:var(--sans);font-size:14px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;min-width:220px}
  .stampnote{font-family:var(--mono);font-size:11px;color:var(--dim2)}

  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 15px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--org-dim)}
  .btn.small{padding:7px 11px;font-size:12px}
  .btn--primary{background:#141414;color:#fff;border-color:#141414}
  .btn--primary:hover{background:#000}
  .btn--org{background:var(--org);color:#fff;border-color:var(--org)}

  /* archetype library */
  .arch-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;transition:.16s}
  .arch-row:hover{border-color:var(--line2)}
  .arch-row .an{font-weight:600;font-size:15.5px;flex:1;min-width:160px}
  .arch-row .am{font-family:var(--mono);font-size:12px;color:var(--dim2)}
  .chip{font-family:var(--mono);font-size:12.5px;color:var(--dim);border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 11px}
  .chip.saved{color:var(--grn);border-color:#BCDBC5;background:#EAF3EC}
  .chip.draft{color:var(--amber);border-color:#E7D8A8;background:#FBF6E7}

  .empty{font-family:var(--mono);font-size:14px;color:var(--dim2);border:1px dashed var(--line2);border-radius:var(--r);padding:40px;text-align:center}

  /* processing meter + rotating pot */
  .meter{margin:18px 0}
  .meter .now{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--dim);margin-bottom:8px}
  .meter .track{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
  .meter .fill{height:100%;background:linear-gradient(90deg,var(--org),var(--org-dim));width:0;transition:width .4s ease}
  .meter .fill.indet{width:40%;animation:indet 1.1s ease-in-out infinite}
  @keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}
  .potspin{width:18px;height:18px;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* stepped meter — ticks through the real pipeline steps */
  .cmeter-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .cmstep{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim2);transition:.25s}
  .cmstep.now{color:var(--txt);font-weight:600}
  .cmstep.done{color:var(--dim)}
  .cmstep .cmi{width:18px;display:inline-flex;justify-content:center;align-items:center;flex:0 0 auto}
  .cmstep .cmi .potspin{width:16px;height:16px}
  .cmstep .cmi .ck{color:var(--grn);font-weight:700}
  .cmstep .cmi .cmdot{width:8px;height:8px;border-radius:50%;background:var(--line2)}

  /* modal */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,24,31,.42);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
  .ov .box{width:min(460px,100%);background:var(--panel-solid);border:1px solid var(--line2);border-radius:var(--r);padding:22px;box-shadow:0 30px 80px -30px #000}
  .ov h3{margin:0 0 8px;font-size:18px}
  .ov p{margin:0 0 12px;font-size:14.5px;color:var(--dim)}
  .ov input,.ov textarea{width:100%;font-family:var(--sans);font-size:14px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;margin-bottom:8px}
  .row{display:flex;gap:8px;justify-content:flex-end}

  .foot{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-top:46px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot .byline{display:inline-flex;align-items:center;gap:9px;text-transform:none;letter-spacing:.02em;color:var(--dim);font-size:13px;text-decoration:none;transition:.16s}
  .foot a.byline:hover{color:var(--org)}
  .foot img.tkb{height:26px;width:auto}
  </style>
</head>
