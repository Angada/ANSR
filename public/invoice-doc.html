<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outcomes — Q&ANSR</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="appbar" class="no-print"></div>
  <div class="wrap">
    <h2 class="no-print" style="color:var(--ansr-navy);font-weight:500;margin:14px 0 2px">Outcomes</h2>
    <p class="no-print lbl" style="margin:0 0 10px;color:var(--ansr-gray)">Retrieve any client + version → invoice, statement, month-by-month, detailed calc.</p>
    <div class="no-print" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 6px">
      <div><label class="lbl">Client</label><select id="selClient" style="min-width:180px"></select></div>
      <div><label class="lbl">Version</label><select id="selRun" style="min-width:170px"></select></div>
      <span id="ohead" class="lbl" style="font-weight:500;color:var(--ansr-navy);align-self:center"></span>
      <span style="margin-left:auto"></span>
      <button class="btn-ai" id="print">⬇ Download / Print invoice</button>
    </div>

    <div class="tabs no-print" role="tablist">
      <button class="tab active" data-tab="invoice">Invoice</button>
      <button class="tab" data-tab="statement">Statement &amp; charts</button>
      <button class="tab" data-tab="months">Month-by-month</button>
      <button class="tab" data-tab="calc">Detailed calculations</button>
    </div>

    <div id="pane-invoice" class="pane"><div id="invoice"></div></div>
    <div id="pane-statement" class="pane" hidden><div id="statement"></div></div>
    <div id="pane-months" class="pane" hidden><div id="months"></div></div>
    <div id="pane-calc" class="pane" hidden><div id="calc"></div></div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("outcomes");</script>
  <script src="/invoice-doc.js"></script>
</body>
</html>
