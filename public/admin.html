<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin — Q&ANSR</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="appbar"></div>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="ai" role="tab" aria-selected="true">AI Skills &amp; Pipelines</button>
      <button class="tab" data-tab="users" role="tab" aria-selected="false">Users &amp; Roles</button>
      <button class="tab" data-tab="integrations" role="tab" aria-selected="false">Integrations</button>
    </div>

    <div id="pane-ai" class="pane">
      <div class="band grad-teal">
        <h3 style="color:var(--ansr-navy);font-weight:500;margin:0 0 4px">AI connectors</h3>
        <p class="lbl" style="color:var(--ansr-gray);font-size:13px;margin:0 0 10px">All providers. Tap one to add its key.</p>
        <div id="connectors" class="connrow"></div>
        <div id="keyedit"></div>
      </div>

      <div id="aiwrite"></div>

      <h3 style="color:var(--ansr-navy);font-weight:500;margin:18px 0 2px">Pipelines by product</h3>
      <p class="lbl" style="color:var(--ansr-gray);font-size:13px;margin:0 0 6px">Each AI gate: provider + model + enable + editable prompt + skills. Raw user text never reaches a model outside an enabled llm/hybrid pipeline.</p>
      <div id="products"></div>
    </div>
    <div id="pane-users" class="pane" hidden style="text-align:center">
      <p class="lbl" style="color:var(--ansr-gray)">Users &amp; roles — coming soon</p>
      <img src="/brand/assets/logos/vikboss.jpg" alt="" class="fade-in" style="max-width:320px;width:100%;border-radius:14px;margin-top:12px">
    </div>
    <div id="pane-integrations" class="pane" hidden><p class="lbl">Integrations — coming.</p></div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("admin");</script>
  <script src="/admin.js"></script>
</body>
</html>
