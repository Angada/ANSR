<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin — Q&ANSR</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/console.css">
</head>
<body>
  <div id="appbar"></div>
  <div class="wrap">
    <div class="hero" style="padding:18px">
      <div class="eyebrow">Admin</div>
      <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:6px">
        <img src="/brand/assets/logos/QAnsr-logo.png" alt="Q&ANSR" style="height:30px;width:auto">
        <h1 style="margin:0">Control room</h1>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="vault" role="tab" aria-selected="true">Vault</button>
      <button class="tab" data-tab="ai" role="tab" aria-selected="false">AI &amp; Pipelines</button>
      <button class="tab" data-tab="integrations" role="tab" aria-selected="false">Integrations</button>
      <button class="tab" data-tab="rules" role="tab" aria-selected="false">Business Rules</button>
      <button class="tab" data-tab="users" role="tab" aria-selected="false">Accounts</button>
    </div>

    <div id="pane-ai" class="pane" hidden>
      <div id="skillFilter" class="skill-filter"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 8px">
        <label class="lbl">Default provider · model — apply to every skill</label>
        <select id="defAll" style="min-width:190px"></select>
        <button class="btn btn--ghost" onclick="applyAllDefault()">Apply to all</button>
        <span id="defMsg" class="lbl"></span>
      </div>
      <div id="products"></div>
    </div>
    <div id="pane-integrations" class="pane" hidden><div id="integrations"></div></div>
    <div id="pane-rules" class="pane" hidden><div id="rules"></div></div>
    <div id="pane-vault" class="pane"><div id="vault"></div></div>
    <div id="pane-users" class="pane" hidden><div id="accounts"></div></div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("admin");</script>
  <script src="/icons.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
