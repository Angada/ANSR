<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mint — AR Reconciler</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="topbar">
    <a href="/" style="text-decoration:none;color:var(--ansr-gray)">←</a>
    <img src="/brand/assets/logos/QAnsr-logo.png" alt="ANSR" style="height:26px">
    <strong style="color:var(--ansr-navy)">Mint</strong>
    <span class="lbl" style="color:var(--ansr-gray);font-size:13px">AR Reconciler</span>

  <div class="wrap">

      <button class="btn" onclick="newContract()">+ New contract</button>

    <div id="contracts"></div>
