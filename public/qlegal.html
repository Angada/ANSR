<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Q-Legal — Legal Repository Intelligence</title>
  <link rel="icon" type="image/png" href="/q-emblem.png">
  <link rel="apple-touch-icon" href="/q-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/brand/assets/logos/pot.png">
  <style>
  /* ===== Q-Legal — self-contained. RayDar design language. ================= */
  :root{
    --bg:#F4F3EF; --bg2:#F9FAFB; --panel:#FFFFFF; --panel-solid:#FFFFFF;
    --line:#E7E3DC; --line2:#D9D3C8;
    --org:#CE4502; --org-dim:#FF5400; --tint:#FFF1E9;
    --cyan:#005465; --amber:#C77B2B; --srcdev:#1B5E38; --mag:#6b3fa0; --red:#C0392B; --grn:#2E7D4F;
    --txt:#141414; --dim:#3D3934; --dim2:#5C564D;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:var(--sans); --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--txt);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 720px at 84% -12%, rgba(206,69,2,.06), transparent 60%),
      radial-gradient(900px 700px at 6% 110%, rgba(0,84,101,.045), transparent 55%),
      linear-gradient(rgba(0,36,46,.028) 1px, transparent 1px) 0 0/100% 46px,
      linear-gradient(90deg, rgba(0,36,46,.024) 1px, transparent 1px) 0 0/46px 100%;}
  .shell{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding:22px 20px 80px}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .ping{width:12px;height:12px;border-radius:50%;background:var(--org);position:relative;box-shadow:0 0 10px var(--org)}
  .ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--org);animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .word{font-weight:700;font-size:24px;letter-spacing:.3em;margin:0}
  .word b{color:var(--org)}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--dim2);text-transform:uppercase}

  .mainnav{display:flex;gap:26px;margin:8px 0 14px}
  .mainnav button{font-family:var(--sans);font-size:18px;font-weight:700;color:var(--dim2);background:none;border:none;padding:6px 0;cursor:pointer;transition:.16s;letter-spacing:.01em}
  .mainnav button:hover{color:var(--txt)}
  .mainnav button.on{color:var(--txt);box-shadow:inset 0 -2px 0 var(--org)}
  .subnav{display:flex;gap:6px;margin:0 0 30px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .subnav button{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--dim);background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;cursor:pointer;transition:.16s;white-space:nowrap}
  .subnav button:hover{color:var(--txt)}
  .subnav button.on{color:var(--org);border-bottom-color:var(--org)}
  .subnav .count{font-size:12px;color:var(--dim2);margin-left:5px}

  .intro{font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:var(--dim);margin:0 0 22px;max-width:78ch;line-height:1.6}
  .intro b{color:var(--txt)}
  .gateslink{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--org);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;transition:.16s}
  .gateslink:hover{border-color:var(--org-dim);background:var(--bg2)}
  .backlnk{font-size:13px;color:var(--org);cursor:pointer;font-weight:600;margin-bottom:10px;display:inline-block}

  .idx{font-size:11.5px;border-radius:20px;padding:2px 8px;white-space:nowrap;cursor:help}
  .idx--ok{background:#E9F6EE;color:#1C6B3D}
  .idx--warn{background:#FDF3E0;color:#8A5A00}
  .idx--bad{background:#FCEBEA;color:#9B2C22}
  .rowact{display:inline-flex;gap:5px;flex-wrap:wrap}
  /* the persistent ingestion batch — the list IS the progress meter */
  .qlb{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);margin:0 0 18px;overflow:hidden}
  .qlb-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
  .qlb-count{color:var(--dim);font-size:12.5px}
  .qlb-live{margin-left:auto;font-size:11.5px;color:var(--org);background:var(--tint);border-radius:20px;padding:2px 9px}
  .qlb-head .btn{margin-left:auto}
  .qlb-row{padding:9px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
  .qlb-row:last-child{border-bottom:0}
  .qlb-row--open{background:#FFFBF4}
  .qlb-name{font-size:13px;word-break:break-word}
  .qlb-state{display:flex;align-items:center;gap:7px;justify-self:end}
  .qlb-stage{font-size:12px;color:var(--dim)}
  .qlb-chip{font-size:11px;border-radius:20px;padding:2px 8px;white-space:nowrap}
  .qlb-chip--ok{background:#E9F6EE;color:#1C6B3D}
  .qlb-chip--warn{background:#FDF3E0;color:#8A5A00}
  .qlb-chip--bad{background:#FCEBEA;color:#9B2C22}
  .qlb-chip--mute{background:var(--tint2,#F3F3F1);color:var(--dim)}
  .qlb-why{grid-column:1/-1;font-size:12.2px;color:var(--dim);line-height:1.5}
  .qlb-act{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
  /* dropzone */
  .drop{border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--panel);padding:26px 22px;margin:0 0 20px;display:flex;align-items:center;gap:16px;transition:.16s;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--org-dim);background:#FFFBF8}
  .drop .ic{width:44px;height:44px;border-radius:11px;background:var(--tint);color:var(--org);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
  .drop .t{font-weight:600;font-size:15.5px}
  .drop .s{font-size:12.5px;color:var(--dim);margin-top:2px}
  .drop input{display:none}

  /* estate chips (by-type counts) */
  .typerow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .typect{font-family:var(--mono);font-size:12px;color:var(--dim);background:#fff;border:1px solid var(--line2);border-radius:999px;padding:5px 12px}
  .typect b{color:var(--org)}

  /* compact filterable tables */
  .cfilter{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .cfilter input{font-family:var(--sans);font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:10px 13px;min-width:240px}
  .cfilter input:focus{outline:none;border-color:var(--org-dim)}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ctable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ctable th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--bg2);white-space:nowrap}
  .ctable td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--txt);vertical-align:top;line-height:1.5}
  .ctable tr:last-child td{border-bottom:none}
  .ctable tr.clk{cursor:pointer}
  .ctable tr.clk:hover td{background:#FFFBF8}
  .am{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .chip{font-family:var(--mono);font-size:12.5px;color:var(--dim);border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 11px}
  .typebadge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--org);background:var(--tint);border:1px solid #F3D6C2;border-radius:999px;padding:3px 10px;white-space:nowrap}
  /* chips carry real information (counts, §§, tags) — they must be readable, not decorative */
  .tagchip{font-family:var(--mono);font-size:11.5px;font-weight:600;color:#00404D;background:#E3EEF0;border:1px solid rgba(0,84,101,.38);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .ref{font-family:var(--mono);font-size:11px;font-weight:600;color:#00404D;border:1px solid rgba(0,84,101,.45);border-radius:5px;padding:1px 6px;white-space:nowrap}
  /* TWO SOURCES, VISIBLY DIFFERENT. A device upload is not governed by the
     SharePoint scan — it can't be re-fetched and nothing keeps it in step — so it
     carries a dark-green marker everywhere it appears: the registry row, the
     contract page, and as its own dimension on the estate map. */
  .srcdev td:first-child{box-shadow:inset 3px 0 0 var(--srcdev)}
  .srcpill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .srcpill.sp{color:#00404D;background:#E3EEF0;border:1px solid rgba(0,84,101,.38)}
  .srcpill.dev{color:var(--srcdev);background:#E6F0E9;border:1px solid var(--srcdev)}
  .empty{font-family:var(--mono);font-size:14px;color:var(--dim2);border:1px dashed var(--line2);border-radius:var(--r);padding:40px;text-align:center}

  /* wiki page */
  .chead{display:flex;align-items:flex-start;gap:15px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 12px 34px -26px rgba(0,36,46,.4)}
  .chead-emb{width:44px;height:44px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:0 0 auto}
  .chead-body{flex:1;min-width:0}
  .chead-titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chead-title{font-size:20px;font-weight:700;line-height:1.25;color:var(--txt)}
  .chead-parties{font-size:14px;color:var(--txt);margin-top:6px;font-weight:500}
  .chead-parties .vs{color:var(--dim2);margin:0 6px;font-weight:400}
  .chead-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:11px}
  .cfact{font-size:12.5px;color:var(--txt);cursor:pointer;border-radius:7px;padding:2px 4px;margin:-2px -4px;transition:.14s}
  .cfact:hover{background:var(--tint)}
  .cfact .cfk{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);display:block;margin-bottom:2px}
  .wikicard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px}
  .rsec-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:0 0 11px}
  .rsummary{margin:0;font-size:13.5px;color:#3a3a3a;line-height:1.7}
  /* version rail */
  .vrail{display:flex;flex-direction:column;gap:9px}
  .vrow{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .vno{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--org);background:var(--tint);border:1px solid #F3D6C2;border-radius:8px;padding:4px 9px;flex:0 0 auto}
  .vdiff{font-size:12px;color:var(--dim);line-height:1.55;white-space:pre-line}
  .vmeta{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:3px}
  .treecard{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;transition:.14s;background:#fff}
  .treecard:hover{border-color:var(--org-dim)}
  .relk{font-family:var(--mono);font-size:10px;color:var(--mag);background:#F1EBFA;border:1px solid #DDCCF3;border-radius:999px;padding:2px 8px}

  /* obligations */
  .duechip{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .due-over{color:#C0392B;background:#FBECEB;border:1px solid #F0CFCF}
  .due-soon{color:#C77B2B;background:#FBF1E2;border:1px solid #EAD3AE}
  .due-ok{color:#2E7D4F;background:#EAF3EC;border:1px solid #BCDBC5}
  .due-none{color:var(--dim2);background:var(--bg2);border:1px solid var(--line)}
  .ochip{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px}
  .o-proposed{color:#8a6d1f;background:#FBF6E7;border:1px solid #E7D8A8}
  .o-confirmed{color:var(--cyan);background:#E6EEF0;border:1px solid rgba(0,84,101,.3)}
  .o-done{color:#2E7D4F;background:#EAF3EC;border:1px solid #BCDBC5}

  /* search + ask */
  .searchbar{display:flex;gap:8px;margin-bottom:18px}
  .searchbar input{flex:1;font-family:var(--sans);font-size:15px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:11px;padding:12px 15px;min-height:44px}
  .searchbar input:focus{outline:none;border-color:var(--org-dim)}
  .hit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:.14s}
  .hit:hover{border-color:var(--org-dim)}
  .hit .hn{font-weight:600;font-size:14.5px}
  .hit .hs{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px}
  .hit .hs b{color:var(--org);background:var(--tint);border-radius:3px;padding:0 2px}
  .askbox{background:#FBF7FF;border:1px solid #E7DBF3;border-radius:12px;padding:13px 15px;margin:18px 0}
  .askbox-h{font-weight:600;font-size:13.5px;color:#6b3fa0;display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .askbox-s{font-family:var(--mono);font-size:10px;color:#9b86bf;font-weight:400;letter-spacing:.04em}
  .askbox-a{background:#fff;border:1px solid #EBE3F5;border-radius:9px;padding:10px 12px;margin-bottom:9px}
  .askbox-q{font-size:12.5px;font-weight:600;color:#141414;margin-bottom:4px}
  .askbox-ans{font-size:12.5px;color:var(--dim);line-height:1.6;white-space:pre-line}
  .askbox-in{display:flex;gap:8px}
  .askbox-in input{flex:1;font-family:var(--sans);font-size:13px;color:var(--txt);background:#fff;border:1px solid #E7DBF3;border-radius:9px;padding:9px 12px;min-height:44px}
  .askbox-in input:focus{outline:none;border-color:#6b3fa0}
  .srcchip{font-size:11px;color:#6b3fa0;background:#F1EBFA;border:1px solid #DDCCF3;border-radius:999px;padding:3px 9px;cursor:pointer}

  /* confirm queue */
  .conf{background:#fff;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .conf-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .kindb{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);background:#FBF1E2;border:1px solid #EAD3AE;border-radius:999px;padding:2px 9px}
  .conf .why{font-size:12.5px;color:var(--dim);line-height:1.5}

  /* business rules */
  .rulecard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--org);border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .rulecard.off{border-left-color:var(--line2);opacity:.6}
  .rulecard .rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
  .rulecard .rt{font-weight:600;font-size:14px;flex:1;min-width:160px}
  .rulecard .rb{font-size:12.5px;color:var(--dim);line-height:1.55}
  .scopeb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);background:#E6EEF0;border:1px solid rgba(0,84,101,.3);border-radius:999px;padding:2px 9px}

  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 15px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:7px;min-height:34px}
  .btn:hover{border-color:var(--org-dim)}
  .btn.small{padding:7px 11px;font-size:12px}
  .btn--primary{background:#141414;color:#fff;border-color:#141414}
  .btn--primary:hover{background:#000}
  .btn--org{background:var(--org);color:#fff;border-color:var(--org)}

  /* processing meter */
  .meter{margin:18px 0}
  .meter .track{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
  .meter .fill{height:100%;background:linear-gradient(90deg,var(--org),var(--org-dim));width:0;transition:width .4s ease}
  .potspin{width:18px;height:18px;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cmeter-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .cmstep{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim2);transition:.25s}
  .cmstep.now{color:var(--txt);font-weight:600}
  .cmstep.done{color:var(--dim)}
  .cmstep .cmi{width:18px;display:inline-flex;justify-content:center;align-items:center;flex:0 0 auto}
  .cmstep .cmi .potspin{width:16px;height:16px}
  .cmstep .cmi .ck{color:var(--grn);font-weight:700}
  .cmstep .cmi .cmdot{width:8px;height:8px;border-radius:50%;background:var(--line2)}

  /* ===== generation motion (staggered reveal) ===== */
  @keyframes gen-shimmer{0%{background-position:-150% 0}100%{background-position:250% 0}}
  @keyframes gen-pop{0%{opacity:0;transform:translateY(10px) scale(.985)}100%{opacity:1;transform:none}}
  @keyframes gen-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,84,0,0)}50%{box-shadow:0 0 0 5px rgba(255,84,0,.14)}}
  @media (prefers-reduced-motion: reduce){.gen,.gen::after,.gen--in{animation:none!important}.gen>*{opacity:1!important;filter:none!important}}
  .gen{position:relative;border:1.5px dashed var(--line2)!important}
  .gen>*{opacity:.25;filter:blur(.5px);transition:opacity .4s ease,filter .4s ease}
  .gen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
    background:linear-gradient(100deg,transparent 30%,rgba(255,84,0,.10) 48%,rgba(0,84,101,.08) 56%,transparent 72%);
    background-size:220% 100%;animation:gen-shimmer 1.05s linear infinite}
  .gen--in{animation:gen-pop .42s cubic-bezier(.22,1,.36,1) both}
  .touch{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .touch:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,36,46,.10)}
  .touch:active{transform:translateY(0) scale(.97)}

  /* ===== Ask — the front door ===== */
  .hero{max-width:860px;margin:6px auto 8px;text-align:center}
  .hero h2{font-size:26px;font-weight:700;margin:0 0 6px}
  .hero .sub{font-size:13.5px;color:var(--dim);margin:0 0 18px}
  .cmd{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:6px 8px 6px 18px;
    box-shadow:0 14px 40px -28px rgba(0,36,46,.5);transition:border-color .2s ease, box-shadow .2s ease}
  .cmd:focus-within{border-color:var(--org);box-shadow:0 0 0 4px rgba(206,69,2,.10),0 14px 40px -24px rgba(0,36,46,.5)}
  .cmd .glyph{color:var(--org);font-size:18px;flex:0 0 auto}
  .cmd input{flex:1;border:none;outline:none;font-family:var(--sans);font-size:16px;color:var(--txt);background:none;min-height:48px}
  .cmd .go{background:var(--org);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .cmd .go:hover{background:var(--org-dim)}
  .sugg{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 4px}
  .sugg .sg{font-size:12.5px;color:var(--dim);background:#fff;border:1px solid var(--line2);border-radius:999px;padding:6px 13px;cursor:pointer}
  .sugg .sg:hover{color:var(--org);border-color:var(--org-dim)}
  .estateline{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--dim2);text-align:center;margin:12px 0 22px}
  .estateline b{color:var(--org)}
  /* live text hits under the bar (search-as-you-type) */
  .livehits{max-width:860px;margin:10px auto 0;text-align:left}
  /* the conversation */
  .chat{max-width:860px;margin:8px auto 0}
  .msg-u{display:flex;justify-content:flex-end;margin:16px 0 8px}
  .msg-u .b{background:#141414;color:#fff;border-radius:14px 14px 4px 14px;padding:10px 15px;font-size:13.5px;max-width:78%;line-height:1.5}
  .msg-a{background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 17px;font-size:13.5px;line-height:1.7;color:#2c2c2c}

  .docchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 7px;cursor:pointer;transition:.15s}
  .docchip:hover{border-color:var(--org);background:var(--tint)}

  .rungline{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:8px}
  .rungline .rk{color:var(--grn)}
  /* thinking card: rungs tick as it reads */
  .thinking{background:#fff;border:1.5px dashed var(--line2);border-radius:14px;padding:14px 17px;margin-top:8px}
  .thinking .tstep{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim2);padding:3px 0;transition:.2s}
  .thinking .tstep.on{color:var(--txt);font-weight:600}
  .thinking .tstep.done{color:var(--dim)}
  .thinking .tstep .ti{width:16px;display:grid;place-items:center}
  /* contract page: highlight block, date tiles, document reel */
  .hl{border-left:3px solid var(--org)}
  .hlrow{display:flex;gap:10px;flex-wrap:wrap}
  .dtile{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .dtile .dl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
  .dtile .dv{font-size:16.5px;font-weight:700;line-height:1.3}
  .dtile .dd{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:3px}
  .dtile.warn{background:#FBECEB;border-color:#F0CFCF}.dtile.warn .dv,.dtile.warn .dd{color:var(--red)}
  .dtile.soon{background:#FBF1E2;border-color:#EAD3AE}.dtile.soon .dd{color:var(--amber)}
  .reel{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px}
  .vcard{flex:0 0 auto;width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .vcard.exec{border-color:#BCDBC5;background:#FBFEFB}
  .vcard .vhead{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .vcard .vdiff{font-size:11px;color:var(--dim);line-height:1.5;margin:6px 0;white-space:pre-line;max-height:64px;overflow:hidden}
  .vcard .vlinks{display:flex;gap:6px;margin-top:6px}

  /* browse filter strip */
  .fstrip{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 14px}
  .fchip{font-size:12.5px;font-weight:600;color:var(--dim);background:#fff;border:1.5px solid var(--line2);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.15s}
  .fchip:hover{border-color:var(--org-dim)}
  .fchip.on{color:#fff;background:var(--org);border-color:var(--org)}
  .fchip .n{opacity:.75;font-weight:500;margin-left:4px}

  /* modal */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,24,31,.42);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
  .ov .box{width:min(480px,100%);background:var(--panel-solid);border:1px solid var(--line2);border-radius:var(--r);padding:22px;box-shadow:0 30px 80px -30px #000}
  .ov h3{margin:0 0 8px;font-size:18px}
  .ov p{margin:0 0 12px;font-size:14.5px;color:var(--dim)}
  .ov input,.ov textarea,.ov select{width:100%;font-family:var(--sans);font-size:14px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;margin-bottom:8px;min-height:40px}
  .row{display:flex;gap:8px;justify-content:flex-end}

  .foot{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-top:46px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media(max-width:640px){.chead{flex-direction:column}.searchbar{flex-direction:column}}
