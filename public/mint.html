<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mint — AR Reconciler</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="appbar"></div>
  <div class="wrap">
    <div class="hero" style="padding:18px 0 6px">
      <div class="eyebrow">Mint · AR Reconciler</div>
      <h1 style="font-size:24px">Contract analysis</h1>
    </div>

    <div class="band grad-soft">
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><label class="lbl">Client</label><select id="client"></select></div>
        <div style="flex:1;min-width:150px"><label class="lbl">Run</label><select id="run"></select></div>
        <button class="btn" id="gen">Generate Contract Analysis</button>
        <button class="btn btn--ghost" id="purge" style="border-color:#b3261e;color:#b3261e">Purge runs</button>
      </div>
      <div id="stepwrap" style="margin-top:14px;display:none"><div class="stepper" id="stepper"></div></div>
    </div>

    <div id="result"></div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("mint");</script>
  <script src="/mint.js"></script>
</body>
</html>
