<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mint — AR Reconciler</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="appbar"></div>
  <div class="wrap">
    <div class="hero" style="padding:18px 0 6px">
      <div class="eyebrow">Mint · AR Reconciler</div>
      <h1 style="font-size:24px">Contract analysis</h1>
    </div>

    <div class="band grad-soft">
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><label class="lbl">Client</label><select id="client"></select></div>
        <div style="flex:1;min-width:150px"><label class="lbl">Run</label><select id="run"></select></div>
        <button class="btn" id="gen">Generate Contract Analysis</button>
        <button class="btn btn--ghost" id="purge" style="border-color:#b3261e;color:#b3261e">Purge runs</button>
      </div>
      <div id="stepwrap" style="margin-top:14px;display:none"><div class="stepper" id="stepper"></div></div>
    </div>

    <div id="result"></div>

    <div class="band grad-accent" style="margin-top:18px">
      <h3 style="color:var(--ansr-navy);font-weight:500;margin:0 0 2px">Working sheet</h3>
      <p class="lbl" style="color:var(--ansr-gray);font-size:13px;margin:0 0 10px">Upload the employee working sheet (max 25 MB). We map columns, flag issues to fix, then save to the database. The sheet can change month to month — re-upload anytime.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="file" id="rfile" accept=".xlsx,.xls,.xlsm,.csv" style="flex:1;min-width:160px">
        <button class="btn" id="rmap">Upload &amp; map</button>
      </div>
      <div id="rout"></div>
    </div>

    <div id="validate"></div>
    <div id="outcome"></div>
  </div>
  <script src="/q.js"></script>
  <script>qHeader("mint");</script>
  <script src="/mint.js"></script>
</body>
</html>
